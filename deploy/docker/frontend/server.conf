        root /lowcoder/client;

	proxy_connect_timeout __LOWCODER_MAX_QUERY_TIMEOUT__;
	proxy_send_timeout __LOWCODER_MAX_QUERY_TIMEOUT__;
	proxy_read_timeout __LOWCODER_MAX_QUERY_TIMEOUT__;

        location / {
            try_files $uri /index.html;

            if ($request_filename ~* .*.(html|htm)$) {
                add_header Cache-Control no-cache;
            }
        }

        location /sdk {
            try_files $uri =404;

	    alias /lowcoder/client-sdk;
	    expires 1M;
	}

       	location /comps {
            try_files $uri =404;

	    alias /lowcoder/client-comps;
	    expires 1M;
	}

       	location /embed {
            try_files $uri =404;

	    alias /lowcoder/client-embed;
	    expires 1M;
	}

	location /assets {
            try_files $uri =404;

	    alias /lowcoder/assets;
	    expires 1M;
	}

        location /api {
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
	    proxy_set_header X-Forwarded-For $remote_addr;
	    proxy_set_header X-Real-IP $remote_addr;
            proxy_pass __LOWCODER_API_SERVICE_URL__;
        }

        location /node-service/plugin-icons {
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
	    proxy_set_header X-Forwarded-For $remote_addr;
	    proxy_set_header X-Real-IP $remote_addr;
            proxy_pass __LOWCODER_NODE_SERVICE_URL__;
        }

        location /proxy/ {
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 120s;
            proxy_pass __LOWCODER_PROXY_SERVICE_URL__;
        }

        # Hocuspocus (Yjs websocket server of the ChatBox component), path passed unchanged
        location /hocuspocus {
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass __LOWCODER_HOCUSPOCUS_SERVICE_URL__;
        }

        # Agora token service: the prefix is removed, /agora-token-service/rte/... reaches it as /rte/...
        location /agora-token-service/ {
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass __LOWCODER_AGORA_TOKEN_SERVICE_URL__/;
        }

