#####################################################################
##                                                                 ##
##  Lowcoder all-in-one compose file.                              ##
##                                                                 ##
##  To run:                                                        ##
##     docker compose up -d                                        ##
##                                                                 ##
#####################################################################

services:

  ##
  ## Start Lowcoder (all-in-one)
  ##
  lowcoder-all-in-one:
    image: lowcoderorg/lowcoder-ce:latest
    container_name: lowcoder
    env_file:
      - path: ./default.env
        required: true
      - path: ./override.env
        required: false
    ports:
      - "3000:3000"
      - "3443:3443"
      # hocuspocus (real-time collaboration websocket)
      - "3006:3006"
      # agora token service
      - "8081:8081"
    #  - "27017:27017"
    volumes:
      - ./lowcoder-stacks:/lowcoder-stacks
      - ./lowcoder-stacks/assets:/lowcoder/assets
    restart: unless-stopped

