{{- if and .Values.proxyService.enabled .Values.proxyService.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "lowcoder.fullname" . }}-proxy-service
  labels:
    {{- include "lowcoder.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "lowcoder.fullname" . }}-proxy-service
  minReplicas: {{ .Values.proxyService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.proxyService.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.proxyService.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.proxyService.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.proxyService.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.proxyService.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
