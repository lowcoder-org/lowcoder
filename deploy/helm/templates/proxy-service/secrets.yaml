{{- if .Values.proxyService.enabled }}
{{- if not .Values.global.config.apiKeySecret }}
{{- fail "proxyService.enabled is true: set global.config.apiKeySecret (without it proxy-service accepts any token)" }}
{{- end }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "lowcoder.fullname" . }}-proxy-service
  labels:
    {{- include "lowcoder.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
stringData:
  # Verifies the proxy tokens api-service signs; without it proxy-service accepts any token
  LOWCODER_API_KEY_SECRET: "{{ .Values.global.config.apiKeySecret }}"
  # Handed to the browser-side bridges, must equal the secret of hocuspocus
  LOWCODER_HOCUSPOCUS_SECRET: {{ .Values.hocuspocus.secret | default "" | quote }}
{{- end }}
