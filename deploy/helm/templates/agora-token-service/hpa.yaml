{{- if and .Values.agoraTokenService.enabled .Values.agoraTokenService.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "lowcoder.fullname" . }}-agora-token-service
  labels:
    {{- include "lowcoder.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "lowcoder.fullname" . }}-agora-token-service
  minReplicas: {{ .Values.agoraTokenService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.agoraTokenService.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.agoraTokenService.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.agoraTokenService.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.agoraTokenService.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.agoraTokenService.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
