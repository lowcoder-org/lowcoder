{{- if .Values.agoraTokenService.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lowcoder.fullname" . }}-agora-token-service
  labels:
    {{- include "lowcoder.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  SERVER_PORT: "8080"
  CORS_ALLOW_ORIGIN: {{ .Values.agoraTokenService.corsAllowOrigin | default "*" | quote }}
{{- end }}
