{{- if .Values.agoraTokenService.enabled }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "lowcoder.fullname" . }}-agora-token-service
  labels:
    {{- include "lowcoder.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
stringData:
  # Empty values make /rte answer 400; /ping keeps working
  APP_ID: {{ .Values.agoraTokenService.appId | default "" | quote }}
  APP_CERTIFICATE: {{ .Values.agoraTokenService.appCertificate | default "" | quote }}
{{- end }}
