{{- if .Values.hocuspocus.enabled }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "lowcoder.fullname" . }}-hocuspocus
  labels:
    {{- include "lowcoder.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
stringData:
  # Empty disables authentication; must equal REACT_APP_HOCUSPOCUS_SECRET of the frontend build
  HOCUSPOCUS_SECRET: {{ .Values.hocuspocus.secret | default "" | quote }}
{{- end }}
