{{- if .Values.hocuspocus.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lowcoder.fullname" . }}-hocuspocus
  labels:
    {{- include "lowcoder.labels" . | nindent 4 }}
spec:
  # Documents live in the memory of one process: a second replica would split the rooms,
  # and a rolling update would briefly run two
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "lowcoder.selectorLabels" (dict "component" "hocuspocus" "Values" .Values "Release" .Release "Chart" .Chart) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/hocuspocus/secrets.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "lowcoder.selectorLabels" (dict "component" "hocuspocus" "Values" .Values "Release" .Release "Chart" .Chart) | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "lowcoder.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.hocuspocus.image.repository }}:{{ .Values.hocuspocus.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.hocuspocus.image.pullPolicy }}
          env:
            - name: PORT
              value: "3006"
            - name: HOST
              value: "0.0.0.0"
          envFrom:
            - secretRef:
                name: {{ include "lowcoder.fullname" . }}-hocuspocus
          ports:
            - name: hocuspocus
              containerPort: 3006
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: hocuspocus
          readinessProbe:
            httpGet:
              path: /health
              port: hocuspocus
          resources:
            {{- include "lowcoder.resources" (dict "service" .Values.hocuspocus "root" .) | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
