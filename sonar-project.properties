# Tests and test infrastructure are not analysed: no issues, no coverage, no duplication from them.
# The Playwright end-to-end suite in e2e/ is run against a container stack, not by a coverage-reporting unit test run.
sonar.exclusions=\
e2e/**,\
**/src/test/**,\
**/__tests__/**,\
**/__mocks__/**,\
**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.cjs,**/*.test.mjs,\
**/*.spec.ts,**/*.spec.tsx,\
server/node-service/test/**,\
