sonar.projectKey=lowcoder-org_lowcoder
sonar.organization=lowcoder
sonar.java.binaries=server/api-service/lowcoder-domain/target,server/api-service/lowcoder-infra/target,server/api-service/lowcoder-sdk/target,server/api-service/lowcoder-server/target,server/api-service/lowcoder-plugins/clickHousePlugin/target,server/api-service/lowcoder-plugins/elasticSearchPlugin/target,server/api-service/lowcoder-plugins/googleSheetsPlugin/target,server/api-service/lowcoder-plugins/graphqlPlugin/target,server/api-service/lowcoder-plugins/mongoPlugin/target,server/api-service/lowcoder-plugins/mssqlPlugin/target,server/api-service/lowcoder-plugins/mysqlPlugin/target,server/api-service/lowcoder-plugins/oraclePlugin/target,server/api-service/lowcoder-plugins/postgresPlugin/target,server/api-service/lowcoder-plugins/redisPlugin/target,server/api-service/lowcoder-plugins/restApiPlugin/target,server/api-service/lowcoder-plugins/smtpPlugin/target,server/api-service/lowcoder-plugins/snowflakePlugin/target,server/api-service/lowcoder-plugins/sqlBasedPlugin/target

# The Playwright end-to-end suite in e2e/ is test and test-infrastructure code. It is run against a
# container stack, not by a coverage-reporting unit test run, so it has no coverage to measure.
sonar.coverage.exclusions=e2e/**

# S5332 (clear-text protocol) in e2e/: the stack talks http between containers on a private Docker
# network, and echo-server.js uses an http:// base only to parse a relative request URL.
sonar.issue.ignore.multicriteria=e2eShellS5332,e2eJsS5332
sonar.issue.ignore.multicriteria.e2eShellS5332.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.e2eShellS5332.resourceKey=e2e/**
sonar.issue.ignore.multicriteria.e2eJsS5332.ruleKey=javascript:S5332
sonar.issue.ignore.multicriteria.e2eJsS5332.resourceKey=e2e/**
