name: Build service docker image

on:
  workflow_call:
    inputs:
      context:
        type: string
        description: 'Docker build context, relative to the repository root'
        required: true
      dockerfile:
        type: string
        description: 'Path to the Dockerfile'
        required: true
      image_name:
        type: string
        description: 'Docker Hub image name without tag'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set environment variables
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          # Map branch to docker image tag: dev -> dev, main -> latest
          case "${BRANCH_NAME}" in
            dev)
              IMAGE_TAG=dev
              ;;
            main)
              IMAGE_TAG=latest
              ;;
            *)
              echo "::error::Unsupported branch '${BRANCH_NAME}': images are only built from 'dev' or 'main'"
              exit 1
              ;;
          esac

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAMES=${IMAGE_NAME}:${IMAGE_TAG}" >> "${GITHUB_ENV}"

      - name: Checkout lowcoder source
        uses: actions/checkout@v4

      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Buildx with cloud driver
        uses: docker/setup-buildx-action@v3
        with:
          version: "lab:latest"
          driver: cloud
          endpoint: "lowcoderorg/lowcoder-cloud-builder"

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAMES }}
