# Build and publish changed SDK versions to npm from dev.

name: Publish Lowcoder SDK

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-lowcoder-sdk
  cancel-in-progress: false

jobs:
  publish-package:
    if: github.repository == 'lowcoder-org/lowcoder' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check version changes
        uses: EndBug/version-check@v1
        id: check
        with:
          diff-search: true
          static-checking: localIsNew
          file-name: client/packages/lowcoder-sdk/package.json
          file-url: https://unpkg.com/lowcoder-sdk@latest/package.json

      - name: Version update detected
        if: steps.check.outputs.changed == 'true'
        run: 'echo "Version change found! New version: ${{ steps.check.outputs.version }} (${{ steps.check.outputs.type }})"'
      
      - name: Set up Node.js for NPM
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify GitHub OIDC availability
        if: steps.check.outputs.changed == 'true'
        run: |
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::GitHub OIDC is unavailable. This publishing job requires id-token: write."
            exit 1
          fi

      - name: Install dependencies
        if: steps.check.outputs.changed == 'true'
        run: node .yarn/releases/yarn-3.6.4.cjs install --immutable
        working-directory: client
      
      - name: Build Package
        if: steps.check.outputs.changed == 'true'
        run: node .yarn/releases/yarn-3.6.4.cjs workspace lowcoder-sdk build
        working-directory: client

      - name: Set up npm for trusted publishing
        if: steps.check.outputs.changed == 'true'
        # OIDC requires npm >=11.5.1. Pin npm 11 to avoid npm 12 install-policy changes.
        run: npm install --global npm@11.21.0 --registry=https://registry.npmjs.org/

      - name: Publish package to npm with OIDC
        if: steps.check.outputs.changed == 'true'
        run: npm publish --access public --registry=https://registry.npmjs.org/
        working-directory: client/packages/lowcoder-sdk
