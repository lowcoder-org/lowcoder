name: hocuspocus tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'client/packages/lowcoder/hocuspocus-server.js'
      - 'deploy/docker/hocuspocus/**'
      - 'deploy/docker/Dockerfile'
      - 'deploy/helm/tests/runtime/hocuspocus-sync.mjs'
      - 'deploy/helm/tests/runtime-test.sh'
      - 'client/yarn.lock'
      - 'server/proxy-service/yarn.lock'
      - '.github/workflows/hocuspocus-tests.yml'
permissions:
  contents: read
jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [26.x]
    defaults:
      run:
        shell: bash
        working-directory: deploy/docker/hocuspocus/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: deploy/docker/hocuspocus/test/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts
      - name: Test
        env:
          NODE_OPTIONS: --test-reporter=tap
        run: |
          set -o pipefail
          node -v
          npm test 2>&1 | tee "$RUNNER_TEMP/node-test.tap"
      - name: Check the test summary
        env:
          MIN_PASS: 11
          TODO: 1
          REQUIRED_TITLES: |
            health: GET /health reports ok and the auth state
            secret: sync with the secret
            secret: wrong and empty tokens are refused with permission-denied
            versions: @hocuspocus/server matches both Dockerfile ARGs
            start: a second server on the same port exits non-zero
        run: |
          log="$RUNNER_TEMP/node-test.tap"
          grep -qx 'TAP version 13' "$log" || { echo "::error::$log is not TAP output"; exit 1; }
          read -r pass fail cancelled skipped todo < <(awk '/^# (pass|fail|cancelled|skipped|todo) [0-9]+$/ { v[$2] = $3 } END { printf "%s %s %s %s %s\n", v["pass"] == "" ? -1 : v["pass"], v["fail"] == "" ? -1 : v["fail"], v["cancelled"] == "" ? -1 : v["cancelled"], v["skipped"] == "" ? -1 : v["skipped"], v["todo"] == "" ? -1 : v["todo"] }' "$log")
          echo "pass $pass, fail $fail, cancelled $cancelled, skipped $skipped, todo $todo"
          grep -E '^ *(not )?ok [0-9]+ - .* # TODO' "$log" || echo "no todo tests"
          [ "$fail" = 0 ] && [ "$cancelled" = 0 ] && [ "$skipped" = 0 ] && [ "$todo" = "$TODO" ] && [ "$pass" -ge "$MIN_PASS" ] \
            || { echo "::error::expected fail 0, cancelled 0, skipped 0, todo $TODO, pass >= $MIN_PASS"; exit 1; }
          n=0
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            awk -v t="$t" '{ l = $0 } sub(/^ *ok [0-9]+ - /, "", l) && l == t { f = 1 } END { exit !f }' "$log" || { echo "::error::no passing test titled: $t"; exit 1; }
            n=$((n + 1))
          done <<< "$REQUIRED_TITLES"
          [ "$n" -gt 0 ] || { echo "::error::REQUIRED_TITLES is empty"; exit 1; }
          echo "$n required titles passed"
